<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskEarn - Premium Rewards Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        },
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Custom scrollbar & UI refinements */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFE066 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wheel-spin-transition {
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99);
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.92; transform: scale(0.98); }
        }
        .pulse-subtle {
            animation: pulse-subtle 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-center p-0 md:p-4">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-slate-900 min-h-screen md:min-h-[844px] md:max-h-[844px] md:rounded-[36px] md:shadow-2xl md:border-4 md:border-slate-800 flex flex-col relative overflow-hidden">
        
        <!-- Header Bar -->
        <header class="bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-amber-400 object-cover">
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h2 class="font-bold text-sm text-slate-100 flex items-center gap-1">
                        Alex Rivers
                        <span class="bg-amber-500/20 text-amber-300 text-[10px] font-semibold px-1.5 py-0.5 rounded border border-amber-500/30">PRO</span>
                    </h2>
                    <p class="text-xs text-slate-400">Level 4 Earner</p>
                </div>
            </div>

            <!-- Balance & Refresh -->
            <div class="flex items-center space-x-2">
                <div id="coinBadge" class="bg-slate-800/90 border border-amber-500/40 hover:border-amber-400 transition-all px-3 py-1.5 rounded-full flex items-center space-x-2 shadow-lg shadow-amber-500/5 cursor-pointer" onclick="switchTab('wallet')">
                    <i class="fa-solid fa-coins text-amber-400 text-sm animate-bounce"></i>
                    <span id="userCoins" class="font-extrabold text-sm gold-gradient-text tracking-tight">1,450</span>
                </div>
                <button onclick="refreshData()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-all border border-slate-700/50 active:scale-95">
                    <i id="refreshIcon" class="fa-solid fa-rotate text-xs"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area (Scrollable) -->
        <main id="appContent" class="flex-1 overflow-y-auto pb-24 px-4 pt-4 space-y-5">
            <!-- Dynamic Tab Content Injected Here -->
        </main>

        <!-- Toast Container -->
        <div id="toastContainer" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-full max-w-xs space-y-2 pointer-events-none px-4"></div>

        <!-- Dynamic Action Modal (Tasks, Games, Surveys) -->
        <div id="actionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
            <div id="modalCard" class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl overflow-hidden shadow-2xl transform transition-transform duration-300 translate-y-full max-h-[90vh] flex flex-col">
                <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                    <h3 id="modalTitle" class="font-bold text-slate-100 flex items-center gap-2">Task Title</h3>
                    <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="modalBody" class="p-5 overflow-y-auto space-y-4 text-sm text-slate-300">
                    <!-- Injected dynamically -->
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 py-2 px-3 z-40">
            <div class="flex justify-around items-center">
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn active flex flex-col items-center py-1 px-3 text-emerald-400 transition-all">
                    <i class="fa-solid fa-house text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Home</span>
                </button>
                <button onclick="switchTab('offers')" id="nav-offers" class="nav-btn flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-all">
                    <i class="fa-solid fa-list-check text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Offers</span>
                </button>
                <button onclick="switchTab('games')" id="nav-games" class="nav-btn flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-all relative">
                    <span class="absolute -top-1 right-2 flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                    </span>
                    <i class="fa-solid fa-gamepad text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Play</span>
                </button>
                <button onclick="switchTab('wallet')" id="nav-wallet" class="nav-btn flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-all">
                    <i class="fa-solid fa-wallet text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Wallet</span>
                </button>
                <button onclick="switchTab('refer')" id="nav-refer" class="nav-btn flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-all">
                    <i class="fa-solid fa-users text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Refer</span>
                </button>
            </div>
        </nav>

    </div>

    <script>
        // Global App State
        let state = {
            coins: 1450,
            streakDays: 3,
            lastClaimDate: null,
            referralCode: "ALEX7789",
            referralsCount: 6,
            referralEarnings: 1200,
            completedTasks: [],
            transactions: [
                { id: "TX1092", type: "Daily Streak", coins: 50, date: "Today, 10:15 AM", status: "Completed", icon: "fa-calendar-check", color: "text-emerald-400" },
                { id: "TX1088", type: "Survey Reward", coins: 250, date: "Yesterday", status: "Completed", icon: "fa-poll", color: "text-blue-400" },
                { id: "TX1075", type: "Paytm Payout", coins: -1000, date: "3 Days ago", status: "Success ($1.00)", icon: "fa-arrow-up-right-from-square", color: "text-amber-400" }
            ],
            currentTriviaIndex: 0
        };

        // Load State from LocalStorage
        function loadState() {
            const saved = localStorage.getItem('taskearn_state');
            if (saved) {
                try {
                    state = { ...state, ...JSON.parse(saved) };
                } catch(e) { console.error("Error loading state", e); }
            }
            updateCoinDisplay();
        }

        // Save State
        function saveState() {
            localStorage.setItem('taskearn_state', JSON.stringify(state));
            updateCoinDisplay();
        }

        function updateCoinDisplay() {
            document.getElementById('userCoins').innerText = state.coins.toLocaleString();
        }

        // Toast Notification System
        function showToast(message, type = 'success', coins = null) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `transform transition-all duration-300 translate-y-[-10px] opacity-0 bg-slate-800 border ${type === 'success' ? 'border-emerald-500/50' : 'border-amber-500/50'} text-slate-100 p-3 rounded-xl shadow-2xl flex items-center justify-between space-x-3`;
            
            let iconHTML = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>' : '<i class="fa-solid fa-circle-info text-amber-400 text-lg"></i>';
            let coinBadge = coins ? `<span class="bg-amber-500/20 text-amber-300 font-bold px-2 py-0.5 rounded text-xs border border-amber-500/30">+${coins} 🪙</span>` : '';

            toast.innerHTML = `
                <div class="flex items-center space-x-3">
                    ${iconHTML}
                    <span class="text-xs font-medium">${message}</span>
                </div>
                ${coinBadge}
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 60,
                    origin: { y: 0.85 }
                });
            }
        }

        function refreshData() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            setTimeout(() => {
                icon.classList.remove('fa-spin');
                showToast("Wallet & Offer Wall Synced", "info");
            }, 800);
        }

        // Navigation Controller
        let activeTab = 'home';
        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-400');
                btn.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-emerald-400');
            }
            renderContent();
        }

        // Main Renderer
        function renderContent() {
            const app = document.getElementById('appContent');
            app.innerHTML = '';

            switch (activeTab) {
                case 'home':
                    renderHomeTab(app);
                    break;
                case 'offers':
                    renderOffersTab(app);
                    break;
                case 'games':
                    renderGamesTab(app);
                    break;
                case 'wallet':
                    renderWalletTab(app);
                    break;
                case 'refer':
                    renderReferTab(app);
                    break;
            }
        }

        // --- TAB 1: HOME ---
        function renderHomeTab(container) {
            container.innerHTML = `
                <!-- Streak Card -->
                <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950 p-4 rounded-2xl border border-indigo-500/20 shadow-xl relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-amber-500/10 rounded-full blur-xl pointer-events-none"></div>
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <h3 class="font-bold text-slate-100 flex items-center gap-1.5 text-sm">
                                <i class="fa-solid fa-fire text-amber-500"></i> Daily Streak Rewards
                            </h3>
                            <p class="text-xs text-slate-400">Log in daily to scale your earnings</p>
                        </div>
                        <span class="bg-indigo-500/20 text-indigo-300 text-xs font-semibold px-2 py-0.5 rounded border border-indigo-500/30">Day ${state.streakDays}</span>
                    </div>
                    
                    <!-- Days Grid -->
                    <div class="grid grid-cols-7 gap-1.5 my-3">
                        ${[1,2,3,4,5,6,7].map(day => {
                            const isDone = day <= state.streakDays;
                            const isCurrent = day === state.streakDays + 1;
                            const reward = day * 25;
                            return `
                                <div class="flex flex-col items-center justify-center p-2 rounded-xl text-center border ${isDone ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-400' : isCurrent ? 'bg-amber-500/20 border-amber-500/60 text-amber-300 animate-pulse' : 'bg-slate-800/40 border-slate-700/50 text-slate-500'}">
                                    <span class="text-[10px] font-semibold">D${day}</span>
                                    <i class="fa-solid ${isDone ? 'fa-check' : 'fa-coins'} text-xs my-1"></i>
                                    <span class="text-[9px] font-bold">+${reward}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <button onclick="claimDailyStreak()" ${state.lastClaimDate === new Date().toDateString() ? 'disabled' : ''} class="w-full mt-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-amber-500/20 active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-xs">
                        <i class="fa-solid fa-hand-holding-dollar"></i>
                        ${state.lastClaimDate === new Date().toDateString() ? 'Claimed Today (Come back tomorrow)' : 'Claim Today\'s Streak Bonus (+100 Coins)'}
                    </button>
                </div>

                <!-- Quick Action Banners -->
                <div class="grid grid-cols-2 gap-3">
                    <div onclick="openQuizModal()" class="bg-gradient-to-br from-purple-900/40 to-slate-900 border border-purple-500/30 p-3.5 rounded-2xl cursor-pointer hover:border-purple-400 transition-all flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center font-bold text-lg border border-purple-500/30">
                            <i class="fa-solid fa-brain"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-xs text-slate-100">Speed Quiz</h4>
                            <p class="text-[10px] text-purple-300 font-semibold">+150 Coins</p>
                        </div>
                    </div>
                    <div onclick="openSpinWheelModal()" class="bg-gradient-to-br from-amber-900/40 to-slate-900 border border-amber-500/30 p-3.5 rounded-2xl cursor-pointer hover:border-amber-400 transition-all flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg border border-amber-500/30">
                            <i class="fa-solid fa-dharmachakra"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-xs text-slate-100">Lucky Wheel</h4>
                            <p class="text-[10px] text-amber-300 font-semibold">Win up to 500</p>
                        </div>
                    </div>
                </div>

                <!-- Featured High-Pay Tasks Header -->
                <div class="flex justify-between items-center pt-2">
                    <h3 class="font-bold text-slate-100 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-amber-400"></i> Featured High Paying Tasks
                    </h3>
                    <span onclick="switchTab('offers')" class="text-xs text-emerald-400 font-semibold cursor-pointer hover:underline">View All</span>
                </div>

                <!-- Featured Task List -->
                <div class="space-y-3">
                    ${getFeaturedTasksHTML()}
                </div>
            `;
        }

        function getFeaturedTasksHTML() {
            const tasks = [
                { id: 't1', title: "Watch Video Sponsor Ad", category: "Video Task", time: "30 sec", coins: 80, icon: "fa-play-circle", color: "from-blue-500 to-indigo-600" },
                { id: 't2', title: "FinTech App Sentiment Survey", category: "Opinion Survey", time: "2 min", coins: 350, icon: "fa-square-poll-vertical", color: "from-emerald-500 to-teal-600" },
                { id: 't3', title: "Test Crypto Trader Simulator", category: "App Testing", time: "1 min", coins: 500, icon: "fa-mobile-screen", color: "from-purple-500 to-pink-600" }
            ];

            return tasks.map(task => {
                const isCompleted = state.completedTasks.includes(task.id);
                return `
                    <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 p-3.5 rounded-2xl flex items-center justify-between transition-all">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${task.color} text-white flex items-center justify-center text-lg shadow-md">
                                <i class="fa-solid ${task.icon}"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-xs text-slate-100">${task.title}</h4>
                                <div class="flex items-center space-x-2 text-[10px] text-slate-400 mt-0.5">
                                    <span><i class="fa-regular fa-clock mr-1"></i>${task.time}</span>
                                    <span>•</span>
                                    <span class="text-slate-300 font-medium">${task.category}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="startTask('${task.id}', '${task.title}', ${task.coins}, '${task.category}')" ${isCompleted ? 'disabled' : ''} class="${isCompleted ? 'bg-slate-800 text-slate-500 border-slate-700' : 'bg-slate-800 hover:bg-emerald-600/20 hover:text-emerald-400 border-emerald-500/40 text-emerald-400'} border px-3 py-1.5 rounded-xl font-bold text-xs transition-all flex items-center space-x-1">
                            ${isCompleted ? '<i class="fa-solid fa-check"></i> <span>Done</span>' : `<i class="fa-solid fa-coins text-amber-400"></i> <span>+${task.coins}</span>`}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // --- TAB 2: OFFERS / TASK ENGINE ---
        function renderOffersTab(container) {
            const allOffers = [
                { id: 'o1', title: "Watch 15s Gaming Trailer", category: "Video", time: "15s", coins: 60, icon: "fa-film", tag: "Fast" },
                { id: 'o2', title: "E-Commerce Experience Feedback", category: "Survey", time: "3 min", coins: 400, icon: "fa-comments", tag: "Hot" },
                { id: 'o3', title: "Install & Open NeoBank App", category: "Install", time: "2 min", coins: 750, icon: "fa-download", tag: "High Value" },
                { id: 'o4', title: "Watch Tech Gadget Unboxing", category: "Video", time: "45s", coins: 120, icon: "fa-video", tag: "Easy" },
                { id: 'o5', title: "Quick Consumer Quiz", category: "Survey", time: "2 min", coins: 280, icon: "fa-clipboard-question", tag: "Trending" }
            ];

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-100 text-base">Offerwall Hub</h3>
                            <p class="text-xs text-slate-400">Complete tasks to instantly earn coins</p>
                        </div>
                        <span class="bg-slate-800 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-full font-medium">${allOffers.length} Available</span>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex space-x-2 overflow-x-auto pb-1 text-xs">
                        <button class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-3 py-1 rounded-full font-semibold whitespace-nowrap">All Tasks</button>
                        <button class="bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 px-3 py-1 rounded-full font-medium whitespace-nowrap">Videos</button>
                        <button class="bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 px-3 py-1 rounded-full font-medium whitespace-nowrap">Surveys</button>
                        <button class="bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 px-3 py-1 rounded-full font-medium whitespace-nowrap">App Installs</button>
                    </div>

                    <!-- Offer List -->
                    <div class="space-y-3">
                        ${allOffers.map(offer => {
                            const isDone = state.completedTasks.includes(offer.id);
                            return `
                                <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl flex items-center justify-between transition-all">
                                    <div class="flex items-center space-x-3.5">
                                        <div class="w-11 h-11 rounded-xl bg-slate-800 border border-slate-700 text-amber-400 flex items-center justify-center text-xl">
                                            <i class="fa-solid ${offer.icon}"></i>
                                        </div>
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <h4 class="font-bold text-xs text-slate-100">${offer.title}</h4>
                                                <span class="bg-amber-500/10 text-amber-400 text-[9px] font-bold px-1.5 py-0.2 rounded border border-amber-500/20">${offer.tag}</span>
                                            </div>
                                            <div class="flex items-center space-x-2 text-[10px] text-slate-400 mt-1">
                                                <span>${offer.category}</span>
                                                <span>•</span>
                                                <span><i class="fa-regular fa-clock mr-0.5"></i>${offer.time}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <button onclick="startTask('${offer.id}', '${offer.title}', ${offer.coins}, '${offer.category}')" ${isDone ? 'disabled' : ''} class="${isDone ? 'bg-slate-800 text-slate-500 border-slate-700' : 'bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950'} px-3.5 py-1.5 rounded-xl font-bold text-xs transition-all shadow-md">
                                        ${isDone ? 'Claimed' : `+${offer.coins} Coins`}
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- TAB 3: GAMES & TRIVIA ---
        function renderGamesTab(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h3 class="font-bold text-slate-100 text-base">Arcade & Mini-Games</h3>
                        <p class="text-xs text-slate-400">Play games to win instant cash coins</p>
                    </div>

                    <!-- Spin Wheel Card -->
                    <div class="bg-gradient-to-br from-amber-950/40 via-slate-900 to-slate-900 border border-amber-500/30 p-5 rounded-2xl text-center space-y-3 relative overflow-hidden">
                        <div class="w-14 h-14 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center text-2xl mx-auto shadow-lg shadow-amber-500/10">
                            <i class="fa-solid fa-dharmachakra animate-spin" style="animation-duration: 8s;"></i>
                        </div>
                        <div>
